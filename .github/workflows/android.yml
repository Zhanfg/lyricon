name: Android CI

on:
  push:
    branches:
      - 'fix/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'debug' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 清理 Runner 不兼容配置
        shell: bash
        run: |
          rm -f gradle/gradle-daemon-jvm.properties
          if [ -f "gradle.properties" ]; then
            sed -i 's/-XX:+CMSClassUnloadingEnabled//g' gradle.properties
            sed -i 's/-Xmx8g/-Xmx4g/g' gradle.properties
            sed -i 's/-XX:MaxMetaspaceSize=2g/-XX:MaxMetaspaceSize=1g/g' gradle.properties
          fi
          chmod +x gradlew

      - name: 解码签名密钥
        if: env.BUILD_TYPE == 'release'
        shell: bash
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.jks

      - name: 构建 APK
        shell: bash
        env:
          RELEASE_STORE_FILE: ../release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Build type: ${BUILD_TYPE}"
          if [ "${BUILD_TYPE}" = "release" ]; then
            ./gradlew --stacktrace :lyricon:assembleRelease
          else
            ./gradlew --stacktrace :lyricon:assembleDebug
          fi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: lyricon-${{ env.BUILD_TYPE }}-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            lyricon/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 清理签名文件
        if: always()
        shell: bash
        run: rm -f release.jks

      - name: 构建摘要
        if: always()
        shell: bash
        run: |
          echo "## Lyricon Build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Type: ${BUILD_TYPE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: #${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
